<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#E8F5E9"/>

  <!-- Wallet body -->
  <rect x="30" y="65" width="130" height="90" rx="12" ry="12" fill="#2E7D32"/>
  <rect x="30" y="80" width="130" height="75" rx="12" ry="12" fill="#388E3C"/>

  <!-- Wallet flap -->
  <rect x="30" y="65" width="130" height="25" rx="12" ry="12" fill="#2E7D32"/>

  <!-- Coin slot / pocket -->
  <rect x="115" y="90" width="35" height="35" rx="8" ry="8" fill="#1B5E20"/>
  <circle cx="132" cy="107" r="11" fill="#FDD835"/>
  <text x="132" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#F57F17">$</text>

  <!-- Bar chart lines (expense tracking) -->
  <rect x="42" y="118" width="12" height="25" rx="3" fill="#A5D6A7"/>
  <rect x="60" y="108" width="12" height="35" rx="3" fill="#66BB6A"/>
  <rect x="78" y="114" width="12" height="29" rx="3" fill="#A5D6A7"/>

  <!-- Checkmark / tick on top card area -->
  <rect x="42" y="72" width="55" height="11" rx="5" fill="#81C784"/>
</svg>
